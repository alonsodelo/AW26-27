<main class="container my-4">
    <h1 class="h3 text-center mb-4">Contacta con nosotros</h1>
    <form id="formContacto" action="#" method="post" novalidate>
        <div class="mb-3">
            <label for="nombreContacto" class="form-label">Nombre completo:</label>
            <input type="text" class="form-control formulario-fondo" id="nombreContacto" name="nombreContacto" placeholder="Tu nombre" required minlength="2" maxlength="100">
            <div class="invalid-feedback" id="error-nombreContacto"></div>
        </div>

        <div class="mb-3">
            <label for="emailContacto" class="form-label">Correo electrónico</label>
            <input type="text" class="form-control formulario-fondo" id="emailContacto" name="emailContacto" placeholder="Tu email" required minlength="2" maxlength="255">
            <div class="invalid-feedback" id="error-emailContacto"></div>
        </div>

        <div class="mb-3">
            <label for="asuntoContacto" class="form-label">Motivo de la consulta:</label>
            <select class="form-control formulario-fondo" id="asuntoContacto" name="asuntoContacto" required>
                <option value="">Selecciona una opción:</option>
                <option value="Información sobre cursos">Información sobre cursos</option>
                <option value="Duda sobre matrículas">Duda sobre matrículas</option>
                <option value="Incidencia técnica">Incidencia técnica</option>
                <option value="Otro motivo">Otro motivo</option>
            </select>
            <div class="invalid-feedback" id="error-asuntoContacto"></div>
        </div>

        <div class="mb-4">
            <label for="mensajeContacto" class="form-label">Mensaje:</label>
            <textarea class="form-control formulario-fondo" id="mensajeContacto" name="mensajeContacto" rows="4" placeholder="Escribe aquí tu consulta..." required minlength="10" maxlength="1000"></textarea>
            <div class="invalid-feedback" id="error-mensajeContacto"></div>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-registro">Enviar mensaje</button>
        </div>
    </form>

    <div id="resumenContacto" class="mt-4"></div>
</main>
