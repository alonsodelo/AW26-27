        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">

                <a class="navbar-brand" href="index.html">
                    <img src="img/fih.png" alt="Logotipo del Centro de Formación" width="40" height="40" class="me-2">
                    <span>Centro de Formación</span>
                </a>
        
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuOpciones">
                    <span class="navbar-toggler-icon"></span>
                </button>

                  <div class="collapse navbar-collapse" id="menuOpciones">
                    <ul class="navbar-nav me-auto navbarPrincipal">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>

                    </ul>

                     <ul class="navbar-nav ms-auto navbarPrincipal align-items-lg-center gap-2" id="menuUsuario">
                        <li class="nav-item"><a class="nav-link" href= "login.html">Iniciar Sesión</a></li>
                        <li class="nav-item"><a class="nav-link" href="registro.html">Registrarse</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

<main class="container my-4">
    <main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <h1 class="mb-0";">Catálogo de Cursos</h1>
        <span class="badge fs-6" id="contadorCursos">0 cursos visibles</span>
    </div>


    <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <label for="buscadorCursos" class="form-label fw-bold" id="textoBuscarCurso">Buscar curso por nombre:</label>
            <div class="flex-wrap d-flex align-items-center gap-2">
                <div class="dropdown">
                <button class="btn btn-curso btn-sm dropdown-toggle" type="button" id="btnFiltroPlazas" data-bs-toggle="dropdown">
                    Plazas
                </button>
                    <div class="dropdown-menu" id="menuPlazas">
                        <button class="dropdown-item" type="button" data-valor="todas">Todos</button>
                        <button class="dropdown-item" type="button" data-valor="disponibles">Con plazas disponibles</button>
                        <button class="dropdown-item" type="button" data-valor="completos">Completos</button>
                    </div>
                </div>
            </div>
        </div>
        <input type="search" id="buscadorCursos" class="form-control formulario-fondo" placeholder="Escribe para filtrar">
        </div>
    </div>


    <div id="contenedorCursos" class="row g-4 mb-5"></div>

    <section class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card tarjeta-registro">
                <div class="card-body p-4">
                    <h2 class="h4 text-center mb-4">Añadir nuevo curso al catálogo</h2>

                    <form id="formNuevoCurso">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombreCurso" class="form-label">Nombre del curso:</label>
                                <input type="text" class="form-control formulario-fondo" id="nombreCurso" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="categoriaCurso" class="form-label">Categoría:</label>
                                <input type="text" class="form-control formulario-fondo" id="categoriaCurso" placeholder="Ej. Programación" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="duracionCurso" class="form-label">Duración (horas):</label>
                                <input type="number" class="form-control formulario-fondo" id="duracionCurso" min="1" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="plazasCurso" class="form-label">Plazas disponibles:</label>
                                <input type="number" class="form-control formulario-fondo" id="plazasCurso" min="0" required>
                            </div>
                        </div>

                        <div id="errorFormularioCurso" class="text-danger fw-bold mb-3"></div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-registro">Añadir curso</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</main>
     
</main>

</footer>
