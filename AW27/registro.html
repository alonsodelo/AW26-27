<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card tarjeta-registro">
                <div class="card-body p-4">
                    <h1 class="h3 text-center mb-4">Crear una cuenta</h1>
                    <form action="#" method="post">
                            <!-- Nombre y Apellidos organizados en 2 columnas con el Grid de Bootstrap -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nombre" class="form-label">Nombre:</label>
                                    <input type="text" class="form-control formulario-fondo" id="nombre" name="nombre" placeholder="Ej. Ana" required minlength="2" maxlength="100">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="apellidos" class="form-label">Apellidos:</label>
                                    <input type="text" class="form-control formulario-fondo" id="apellidos" name="apellidos" placeholder="Ej. García López" required minlength="2" maxlength="100">
                                </div>
                            </div>

                            <!-- Correo electrónico (type="email") -->
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo electrónico:</label>
                                <input type="email" class="form-control formulario-fondo" id="email" name="email" placeholder="usuario@ejemplo.com" required maxlength="100">
                            </div>

                            <!-- Contraseña (type="password") + Texto de ayuda (Diapositiva 48) -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña:</label>
                                <input type="password" class="form-control" id="password" name="password" required minlength="8" maxlength="255" pattern="(?=.*[A-Za-z])(?=.*\d).{8,}">
                                <small class="form-text peque">
                                    Usa una contraseña segura con letras y números.
                                </small>
                            </div>
                            <!-- Confirmación de contraseña (type="password") -->
                            <div class="mb-4">
                                <label for="confirmarPassword" class="form-label">Confirmar contraseña:</label>
                                <input type="password" class="form-control" id="confirmarPassword" name="confirmarPassword" required minlength="8" maxlength="255" pattern="(?=.*[A-Za-z])(?=.*\d).{8,}">
                            </div>

                            <!-- Botones de acción -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-registro">Registrarse</button>
                            </div>
                        </form>
                </div>
            </div>
        </div>
    </div>
